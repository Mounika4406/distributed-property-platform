events {
    worker_connections 1024;
}

http {
    # Custom log format to include upstream response time
    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log custom;

    # Upstream group for US services with EU backup
    upstream us_backend {
        server backend-us:8000 max_fails=1 fail_timeout=5s;
        server backend-eu:8000 backup;
    }

    # Upstream group for EU services with US backup
    upstream eu_backend {
        server backend-eu:8000 max_fails=1 fail_timeout=5s;
        server backend-us:8000 backup;
    }

    server {
        listen 80;

        location /us/ {
            # Proxy requests to the US backend; fail over to EU if US is down
            proxy_pass http://us_backend;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /eu/ {
            # Proxy requests to the EU backend; fail over to US if EU is down
            proxy_pass http://eu_backend;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
